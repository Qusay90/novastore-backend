<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaStore | Kategoriler</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <script src="/mobile-bridge.js"></script>
    <script src="/shared-state-sync.js"></script>
    <script src="/favorites-sync.js"></script>
    <script src="/category-navigation-fallback.js"></script>
    <script src="/catalog-plp.js"></script>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #F7F9FC;
            color: #111827;
        }

        .native-categories-page {
            width: 100%;
            padding: 14px 12px 112px;
            box-sizing: border-box;
        }

        .native-categories-title {
            margin: 4px 2px 8px;
            color: #0F2A43;
            font-size: 1.34rem;
            line-height: 1.15;
            font-weight: 900;
        }

        .native-categories-lead {
            margin: 0 2px 14px;
            color: #64748B;
            font-size: 0.84rem;
            line-height: 1.45;
            font-weight: 650;
        }

        .native-categories-list {
            display: grid;
            gap: 11px;
        }

        .native-category-card {
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            background: #FFFFFF;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(15, 42, 67, 0.055);
        }

        .native-category-main {
            width: 100%;
            min-height: 76px;
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr) 30px;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            border: 0;
            background:
                radial-gradient(circle at 92% 16%, rgba(247, 148, 29, 0.14), transparent 30%),
                linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
            color: #0F2A43;
            text-align: left;
            text-decoration: none;
            font: inherit;
            cursor: pointer;
        }

        .native-category-mark {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #FFF7ED;
            color: #F7941D;
            font-size: 1rem;
            font-weight: 900;
        }

        .native-category-copy {
            min-width: 0;
        }

        .native-category-copy strong,
        .native-category-copy em {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .native-category-copy strong {
            color: #0F2A43;
            font-size: 1rem;
            line-height: 1.15;
            font-weight: 900;
        }

        .native-category-copy em {
            margin-top: 4px;
            color: #64748B;
            font-size: 0.74rem;
            font-style: normal;
            font-weight: 750;
        }

        .native-category-arrow {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: #FFF7ED;
            color: #F7941D;
            font-style: normal;
            font-weight: 900;
        }

        .native-subcategory-list {
            padding: 0 14px 14px 70px;
        }

        .native-subcategory-tree {
            display: grid;
            gap: 7px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .native-subcategory-tree .native-subcategory-tree {
            margin: 7px 0 0 12px;
            padding-left: 12px;
            border-left: 2px solid #FED7AA;
        }

        .native-subcategory-node {
            list-style: none;
        }

        .native-subcategory-link {
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            border: 1px solid #FED7AA;
            border-radius: 999px;
            background: #FFFBF7;
            color: #9A4B08;
            text-decoration: none;
            font-size: 0.76rem;
            font-weight: 800;
            line-height: 1;
            text-align: center;
            box-shadow: none;
        }

        .native-subcategory-link.is-presentation-only,
        .native-category-main.is-presentation-only {
            cursor: default;
        }

        .native-category-empty,
        .native-category-error {
            padding: 18px;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            background: #FFFFFF;
            color: #64748B;
            text-align: center;
            font-weight: 700;
        }

        .native-loading {
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #64748B;
            font-weight: 750;
        }

        .native-loading-spinner {
            position: relative;
            width: 42px;
            height: 42px;
            border: 3px solid #E5E7EB;
            border-right-color: #F7941D;
            border-bottom-color: #F7941D;
            border-radius: 999px;
            animation: nativeLoadingSpin 0.72s linear infinite;
        }

        .native-loading-spinner::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            right: 1px;
            top: 4px;
            border-radius: 999px;
            background: #F7941D;
            box-shadow: 0 0 0 4px rgba(247, 148, 29, 0.12);
        }

        .category-plp-shell {
            display: grid;
            gap: 16px;
        }

        .category-plp-breadcrumb {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            color: #64748B;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .category-plp-breadcrumb a,
        .category-plp-product-link,
        .category-plp-child {
            color: inherit;
            text-decoration: none;
        }

        .category-plp-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #E2E8F0;
        }

        .category-plp-kicker {
            margin: 0 0 4px;
            color: #F7941D;
            font-size: 0.76rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .category-plp-header h1 {
            margin: 0;
            color: #0F2A43;
            font-size: 1.4rem;
            line-height: 1.15;
        }

        .category-plp-count {
            color: #0F2A43;
            white-space: nowrap;
        }

        .category-plp-children {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-plp-child {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            background: #FFFFFF;
            color: #0F2A43;
        }

        .category-plp-child span {
            color: #64748B;
            font-size: 0.78rem;
        }

        .category-plp-tools label {
            display: grid;
            gap: 6px;
            color: #0F2A43;
            font-size: 0.84rem;
            font-weight: 800;
        }

        .category-plp-tools input {
            min-height: 42px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            padding: 0 12px;
            font: inherit;
        }

        .category-plp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .category-plp-product {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            background: #FFFFFF;
            padding: 12px;
        }

        .category-plp-product-media {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            background: #F1F5F9;
            overflow: hidden;
        }

        .category-plp-product-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .category-plp-product .product-title {
            min-height: 42px;
            margin: 10px 0;
            color: #0F2A43;
            font-size: 0.95rem;
            line-height: 1.25;
        }

        .category-plp-product-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: auto;
        }

        .category-plp-price {
            display: grid;
            gap: 2px;
            color: #0F2A43;
        }

        .category-plp-price span {
            color: #94A3B8;
            font-size: 0.78rem;
            text-decoration: line-through;
        }

        .category-plp-price strong {
            color: #F7941D;
        }

        .btn-favorite {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            border: 1px solid #E2E8F0;
            border-radius: 50%;
            background: #FFFFFF;
            cursor: pointer;
            z-index: 2;
        }

        .btn-favorite svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #64748B;
            stroke-width: 2;
        }

        .btn-favorite.active svg {
            fill: #EF4444;
            stroke: #EF4444;
        }

        .btn-add {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 8px;
            background: #F8FAFC;
            cursor: pointer;
        }

        .btn-add:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .category-plp-empty {
            padding: 22px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            background: #FFFFFF;
            color: #64748B;
            text-align: center;
            font-weight: 800;
        }

        @keyframes nativeLoadingSpin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <link rel="stylesheet" href="/commerce-pro-foundation.css">
</head>

<body class="commerce-pro-v3">
    <main class="native-categories-page">
        <h1 class="native-categories-title">Kategoriler</h1>
        <p class="native-categories-lead">Alışverişini hızlandıran ana bölümler ve alt kategoriler.</p>
        <section class="native-categories-list" id="native-categories-list">
            <div class="native-loading"><span class="native-loading-spinner"></span><strong>Kategoriler yükleniyor...</strong></div>
        </section>
    </main>

    <script>
        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function categoryUrl(category) {
            if (window.NovaStoreCategoryNavigation?.categoryUrl) {
                return window.NovaStoreCategoryNavigation.categoryUrl(category);
            }
            const key = category && typeof category === 'object'
                ? (category.path || category.slug || '')
                : '';
            const encoded = String(key)
                .replace(/^\/+|\/+$/g, '')
                .split('/')
                .filter(Boolean)
                .map(encodeURIComponent)
                .join('/');
            return encoded ? '/kategori/' + encoded : null;
        }

        function renderNativeCategoryCards(mainCategories) {
            return mainCategories.map((main) => {
                const children = Array.isArray(main.children) ? main.children : [];
                const firstLetter = String(main.name || 'N').trim().charAt(0).toLocaleUpperCase('tr-TR');
                const childText = children.length
                    ? children.length + ' alt kategori'
                    : 'Tüm ürünleri görüntüle';
                const childrenHtml = children.length
                    ? '<div class="native-subcategory-list">' +
                        (window.NovaStoreCategoryNavigation?.renderDirectoryTree(children) || '') +
                        '</div>'
                    : '';
                const content = [
                    '<span class="native-category-mark">' + escapeHtml(firstLetter) + '</span>',
                    '<span class="native-category-copy"><strong>' + escapeHtml(main.name) + '</strong><em>' + childText + '</em></span>',
                    '<span class="native-category-arrow">&rsaquo;</span>'
                ].join('');
                const target = categoryUrl(main);
                const mainHtml = target
                    ? '<a class="native-category-main" href="' + escapeHtml(target) + '">' + content + '</a>'
                    : '<div class="native-category-main is-presentation-only">' + content + '</div>';

                return '<article class="native-category-card">' + mainHtml + childrenHtml + '</article>';
            }).join('');
        }

        async function loadNativeCategories() {
            const list = document.getElementById('native-categories-list');
            const title = document.querySelector('.native-categories-title');
            const lead = document.querySelector('.native-categories-lead');

            try {
                const mountedPlp = await window.NovaStoreCategoryPlp?.mountCategoryPlp?.({
                    document,
                    location: window.location,
                    history: window.history,
                    fetch: window.fetch.bind(window),
                    container: list,
                    title,
                    lead
                });
                if (mountedPlp) return;

                const response = await fetch('/api/public/categories?format=tree');
                if (!response.ok) throw new Error(`Kategori isteği başarısız (${response.status}).`);
                const categories = await response.json();
                const mainCategories = Array.isArray(categories)
                    ? (window.NovaStoreCategoryNavigation?.buildNavigationTree(categories)
                        || categories.filter((category) => category.parent_id === null))
                    : [];

                if (!mainCategories.length) {
                    list.innerHTML = '<div class="native-category-empty">Kategori bulunamadı.</div>';
                    return;
                }

                list.innerHTML = renderNativeCategoryCards(mainCategories);
            } catch (error) {
                const fallback = window.NovaStoreCategoryNavigation?.buildFallbackNavigationTree?.() || [];
                list.innerHTML = fallback.length
                    ? renderNativeCategoryCards(fallback)
                    : '<div class="native-category-error">Kategoriler yüklenemedi.</div>';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadNativeCategories);
        } else {
            loadNativeCategories();
        }
    </script>
</body>

</html>
